<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snake 2034 — 3D Prototype with Tails</title>
  <style>
    html,body{height:100%;margin:0;background:#051018;color:#e6eef3;font-family:Inter,system-ui,Arial}
    #wrap{display:flex;flex-direction:column;align-items:center;padding:12px}
    #canvasContainer{width:100%;max-width:1200px;height:640px;border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.7)}
    #hud{width:100%;max-width:1200px;margin-top:10px;display:flex;justify-content:space-between;gap:8px}
    .panel{background:rgba(255,255,255,0.02);padding:8px 12px;border-radius:8px;font-size:14px}
    .small{font-size:13px;color:#98a0ad}
    a{color:#7ef9a6}
  </style>
</head>
<body>
  <div id="wrap">
    <h1>Snake 2034 — 3D Prototype</h1>
    <div class="small">Now in real 3D with per-entity tails. Controls: WASD / Arrow keys — move; Q — companion mode/shield toggle (single to toggle mode, double to toggle shield); E — pickup; I — use inventory.</div>

    <div id="canvasContainer"></div>

    <div id="hud">
      <div class="panel" id="stats">HP: <span id="hp">100</span> &nbsp; Energy: <span id="energy">100</span></div>
      <div class="panel" id="comp">Companion: <span id="cmode">Follow</span> | Stress: <span id="cstress">0</span></div>
      <div class="panel">Inventory: <span id="inv">(empty)</span></div>
    </div>
  </div>

  <!-- Three.js from CDN -->
  <script src="https://unpkg.com/three@0.154.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.154.0/examples/js/controls/OrbitControls.js"></script>
  <script>
  // Basic 3D prototype with tails for every moving entity.
  const container = document.getElementById('canvasContainer');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x071018);

  const camera = new THREE.PerspectiveCamera(60, 1200/640, 0.1, 2000);
  camera.position.set(0, 120, 220);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(Math.min(window.innerWidth-40,1200), 640);
  container.appendChild(renderer.domElement);

  // Lights
  const hemi = new THREE.HemisphereLight(0x99e6ff, 0x101020, 0.8); scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.8); dir.position.set(80,120,60); scene.add(dir);

  // Ground grid
  const grid = new THREE.GridHelper(1000, 50, 0x11333b, 0x071a22); grid.position.y = 0; scene.add(grid);

  // Entities structure: each entity has head (mesh), tail segments (meshes), history (array of Vector3)
  function makeTailGroup(colorHex, segmentCount, segmentRadius){
    const segments = [];
    const mat = new THREE.MeshStandardMaterial({color: colorHex, metalness:0.2, roughness:0.7, emissive: colorHex*0.02});
    for(let i=0;i<segmentCount;i++){
      const g = new THREE.SphereGeometry(Math.max(0.8, segmentRadius*(1 - i/segmentCount)), 10, 10);
      const m = new THREE.Mesh(g, mat);
      m.castShadow = false; m.receiveShadow = false; m.visible = true;
      scene.add(m); segments.push(m);
    }
    return segments;
  }

  // Player
  const player = {head:null, speed:120, hp:100, energy:100, radius:6, pos:new THREE.Vector3(-40,8,0), dir: new THREE.Vector3(1,0,0), history:[], tail:null, tailCount:18};
  const playerMat = new THREE.MeshStandardMaterial({color:0x9efbb5, metalness:0.2, roughness:0.5});
  const pGeom = new THREE.SphereGeometry(player.radius, 16, 12);
  player.head = new THREE.Mesh(pGeom, playerMat); player.head.position.copy(player.pos); scene.add(player.head);
  player.tail = makeTailGroup(0x9efbb5, player.tailCount, 5);

  // Companion
  const companion = {head:null, mode:'follow', stress:0, grip:100, radius:5, pos:new THREE.Vector3(-60,6,20), history:[], tail:null, tailCount:14, shield:false};
  const cGeom = new THREE.SphereGeometry(companion.radius, 12, 10);
  const cMat = new THREE.MeshStandardMaterial({color:0x98d3ff, metalness:0.1, roughness:0.6});
  companion.head = new THREE.Mesh(cGeom, cMat); companion.head.position.copy(companion.pos); scene.add(companion.head);
  companion.tail = makeTailGroup(0x98d3ff, companion.tailCount, 4);

  // Fry (food)
  const fry = {head:null, pos:new THREE.Vector3(20,6,-40), radius:4, picked:false};
  const fryMat = new THREE.MeshStandardMaterial({color:0xffdd55});
  fry.head = new THREE.Mesh(new THREE.SphereGeometry(fry.radius,10,8), fryMat); fry.head.position.copy(fry.pos); scene.add(fry.head);

  // Micro hissers swarm
  const micros = [];
  for(let i=0;i<30;i++){
    const m = {head:null, pos:new THREE.Vector3((Math.random()*200-100),6,(Math.random()*200-100)), radius:2 + Math.random()*1.2, history:[], tail:null, tailCount:6};
    m.head = new THREE.Mesh(new THREE.SphereGeometry(m.radius,10,8), new THREE.MeshStandardMaterial({color:0xcfffda}));
    m.head.position.copy(m.pos); scene.add(m.head);
    m.tail = makeTailGroup(0xcfffda, m.tailCount, 2.6);
    micros.push(m);
  }

  // Boss
  const boss = {head:null, pos:new THREE.Vector3(120,12,-80), radius:14, hp:300, shootTimer:2.0, history:[], tail:null, tailCount:24};
  boss.head = new THREE.Mesh(new THREE.SphereGeometry(boss.radius, 28, 20), new THREE.MeshStandardMaterial({color:0xff6b6b})); boss.head.position.copy(boss.pos); scene.add(boss.head);
  boss.tail = makeTailGroup(0xff6b6b, boss.tailCount, 12);

  // Projectiles
  const projectiles = [];

  // Simple input
  const keys = {};
  window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; if(e.key.toLowerCase()==='i'){ consumeInventory(); } });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

  // Inventory
  const inventory = [];

  // Q handling (single to toggle mode, double to toggle shield)
  let lastQ = 0;
  window.addEventListener('keydown', e=>{
    if(e.key.toLowerCase()==='q'){
      const now = performance.now();
      if(now - lastQ < 350){ companion.shield = !companion.shield; document.getElementById('cmode').textContent = companion.mode + (companion.shield? ' (Shielding)':''); lastQ = 0; }
      else { companion.mode = (companion.mode==='follow')? 'scout' : 'follow'; document.getElementById('cmode').textContent = companion.mode + (companion.shield? ' (Shielding)':''); lastQ = now; }
    }
  });

  // Resize handler
  window.addEventListener('resize', ()=>{ const w = Math.min(window.innerWidth-40,1200); renderer.setSize(w,640); camera.aspect = w/640; camera.updateProjectionMatrix(); });

  // Utility: limit history length and push pos
  function pushHistory(entity){
    const p = entity.head.position.clone();
    entity.history.unshift(p);
    const maxLen = 180; if(entity.history.length > maxLen) entity.history.length = maxLen;
  }

  // Update tail meshes positions by sampling history at intervals
  function updateTail(entity){
    const segs = entity.tail.length;
    const history = entity.history;
    for(let i=0;i<segs;i++){
      const idx = Math.floor((i+1) * (history.length / (segs+1)));
      const target = history[idx] || entity.head.position;
      // smooth lerp
      entity.tail[i].position.lerp(target, 0.45);
      // scale falloff (already sized in creation)
    }
  }

  // Boss shooting
  function bossShoot(){
    const dir = new THREE.Vector3().subVectors(player.head.position, boss.head.position).normalize();
    const speed = 220;
    const proj = {mesh: new THREE.Mesh(new THREE.SphereGeometry(2.8,8,8), new THREE.MeshStandardMaterial({color:0xa0ffd9})), v: dir.multiplyScalar(speed), life:4.0};
    proj.mesh.position.copy(boss.head.position);
    scene.add(proj.mesh); projectiles.push(proj);
  }

  // Simple collision distance check
  function dist3(a,b){ return a.distanceTo(b); }

  // Game loop
  let last = performance.now()/1000;
  function animate(){
    const now = performance.now()/1000; const dt = Math.min(0.05, now - last); last = now;

    // Player movement (XZ plane)
    const move = new THREE.Vector3();
    if(keys['w']||keys['arrowup']) move.z -= 1; if(keys['s']||keys['arrowdown']) move.z += 1; if(keys['a']||keys['arrowleft']) move.x -= 1; if(keys['d']||keys['arrowright']) move.x += 1;
    if(move.lengthSq() > 0.001){ move.normalize(); move.multiplyScalar(player.speed * dt); player.head.position.add(move); player.dir.copy(move).normalize(); }

    // bounds clamp (play area)
    player.head.position.x = THREE.MathUtils.clamp(player.head.position.x, -380, 380);
    player.head.position.z = THREE.MathUtils.clamp(player.head.position.z, -380, 380);

    // companion behaviour
    if(companion.mode === 'follow'){
      const desired = new THREE.Vector3().copy(player.head.position).add(new THREE.Vector3(-30,0,20));
      const diff = new THREE.Vector3().subVectors(desired, companion.head.position).multiplyScalar(3.0*dt);
      companion.head.position.add(diff);
    } else {
      // scout: forward of player
      const scoutTarget = new THREE.Vector3().copy(player.head.position).add(player.dir.clone().multiplyScalar(120));
      const diff = new THREE.Vector3().subVectors(scoutTarget, companion.head.position).multiplyScalar(2.5*dt);
      companion.head.position.add(diff);
    }
    // simple stress/grip changes
    if(companion.shield){ companion.stress = Math.min(100, companion.stress + dt*12); companion.grip = Math.max(0, companion.grip - dt*8); } else { companion.stress = Math.max(0, companion.stress - dt*10); companion.grip = Math.min(100, companion.grip + dt*6); }

    // micros: mild wander + seek player
    let microNearCount = 0;
    micros.forEach(m=>{
      const toPlayer = new THREE.Vector3().subVectors(player.head.position, m.head.position);
      const dist = toPlayer.length();
      toPlayer.normalize();
      // avoidance and seek
      const speed = 40 + Math.random()*20;
      m.head.position.add(toPlayer.multiplyScalar((dist<120?0.9:0.25) * dt * speed));
      // small wander
      m.head.position.x += (Math.sin(now*2 + m.head.position.x*0.01) * 0.6) * dt;
      // count near
      if(dist < 20) microNearCount++;
      // update history and tail
      pushHistory(m); updateTail(m);
    });

    // paralysis if many micros nearby
    if(microNearCount >= 8){ /* a short stun */ }

    // boss behavior
    boss.shootTimer -= dt; if(boss.shootTimer <= 0){ boss.shootTimer = 1.6; bossShoot(); }

    // advance projectiles
    for(let i=projectiles.length-1;i>=0;i--){ const p = projectiles[i]; p.mesh.position.addScaledVector(p.v, dt); p.life -= dt; if(p.life<=0){ scene.remove(p.mesh); projectiles.splice(i,1); } else {
        // collision with player
        if(dist3(p.mesh.position, player.head.position) < 8){ player.hp = Math.max(0, player.hp - 16); scene.remove(p.mesh); projectiles.splice(i,1); }
        // companion shield reduction
        if(companion.shield && dist3(p.mesh.position, companion.head.position) < 40){ // absorb some
          player.hp = Math.max(0, player.hp - 6); scene.remove(p.mesh); projectiles.splice(i,1); companion.stress += 8;
        }
      }
    }

    // push histories and update tails for player, companion, boss
    pushHistory(player); updateTail(player);
    pushHistory(companion); updateTail(companion);
    pushHistory(boss); updateTail(boss);

    // update HUD
    document.getElementById('hp').textContent = Math.round(player.hp);
    document.getElementById('energy').textContent = Math.round(player.energy);
    document.getElementById('cstress').textContent = Math.round(companion.stress);

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  // Start the loop
  animate();

  // Simple pickup via E key
  window.addEventListener('keydown', e=>{ if(e.key.toLowerCase()==='e'){ if(!fry.picked && player.head.position.distanceTo(fry.head.position) < 18){ fry.picked = true; scene.remove(fry.head); inventory.push('Forbidden Royal Fry'); document.getElementById('inv').textContent = inventory.join(', '); document.getElementById('cmode').textContent = companion.mode + (companion.shield? ' (Shielding)':''); document.getElementById('hp').textContent = Math.round(player.hp); document.getElementById('energy').textContent = Math.round(player.energy); } } });
  function consumeInventory(){ const idx = inventory.indexOf('Forbidden Royal Fry'); if(idx>=0){ inventory.splice(idx,1); player.energy = Math.min(220, player.energy + 80); document.getElementById('inv').textContent = inventory.length? inventory.join(', '): '(empty)'; /* apply slow effect by reducing speed temporarily */ player.speed *= 0.5; setTimeout(()=>{ player.speed *= 2; }, 8000); } }

  // Simple camera follow of player
  (function cameraFollowLoop(){ requestAnimationFrame(function loop(){ camera.position.lerp(new THREE.Vector3(player.head.position.x, player.head.position.y+120, player.head.position.z+220), 0.08); camera.lookAt(player.head.position); loop(); }); })();

  </script>
</body>
</html>
